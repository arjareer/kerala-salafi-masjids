<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kerala Salafi Masjids</title>
<meta name="description" content="Find Salafi (KNM, Markazudawa, Wisdom) masjids across Kerala on a street map, nearest first, with Google Maps directions.">
<meta name="theme-color" content="#fafaf7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&family=Noto+Sans+Malayalam:wght@500&display=swap">
<style>
/* Layout (Google Maps style): full-screen map with a search bar and one "Near me" button.
   Near me or a search slides up a list sheet: mini (header only) / half / full screen, or closed. */
:root{
  /* Wimbledon palette: white first, deep green, a whisper of muted champagne gold. No saffron/orange anywhere. */
  --ink:#1b2a22; --muted:#7c857f; --line:#eeefea;
  --glass:rgba(255,255,255,.95); --bg:#fafaf7;
  --black:#0b4d2c; --accent:#2e6b46; --accent-soft:#e9f1eb; --gold:#b49f68; --gold-soft:#f4f0e4; --you:#3d8bff;
  --r-xl:28px; --r-lg:20px;
  --shadow:0 18px 40px rgba(11,40,25,.10),0 2px 8px rgba(11,40,25,.06);
  --font:"Nunito Sans",-apple-system,"SF Pro Text",system-ui,sans-serif;
  --ml:"Noto Sans Malayalam","Nunito Sans",sans-serif;
  --top:calc(70px + env(safe-area-inset-top));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font:16px/1.4 var(--font);color:var(--ink);background:var(--bg);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--you);outline-offset:2px}
#map{position:fixed;inset:0;background:#e9eaee}
.leaflet-tile-pane{filter:grayscale(1) brightness(1.2) contrast(.62)}
#map{background:#fafaf7!important}
.leaflet-control-attribution{font-size:10px;background:rgba(255,255,255,.7)!important;border-radius:8px 0 0 0}
.leaflet-control-zoom{display:none}

/* search bar */
.top{position:fixed;z-index:700;top:calc(12px + env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right))}
.search{height:50px;border-radius:999px;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;padding:0 8px 0 18px}
.search input{border:0;background:none;outline:none;flex:1;min-width:0;font-size:16px;font-weight:600}
.search input::placeholder{color:#717171;font-weight:400}
.search input::-webkit-search-cancel-button{display:none}
.search>svg{width:18px;height:18px;color:var(--ink);flex:none}
.clear{-webkit-appearance:none;appearance:none;padding:0;line-height:0;border:0;background:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.clear[hidden]{display:none}

/* floating pill buttons */
.fab{position:fixed;z-index:650;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom));height:52px;padding:0 26px;border:0;border-radius:999px;background:var(--black);color:#fff;font-size:16px;font-weight:600;letter-spacing:.01em;display:flex;align-items:center;gap:10px;cursor:pointer;box-shadow:0 16px 36px rgba(11,40,25,.32)}
.fab svg{width:19px;height:19px;color:var(--gold)}
.fab[hidden]{display:none}
#mapBtn{height:46px;padding:0 20px;font-size:15px}

/* list sheet */
.sheet{position:fixed;z-index:600;left:0;right:0;bottom:0;height:var(--h,48%);background:#fff;border-radius:var(--r-xl) var(--r-xl) 0 0;
  box-shadow:0 -4px 24px rgba(0,0,0,.14);display:flex;flex-direction:column;transition:height .3s cubic-bezier(.2,.8,.2,1),transform .3s cubic-bezier(.2,.8,.2,1)}
.sheet.dragging{transition:none}
body:not(.open) .sheet{transform:translateY(110%)}
body.full .sheet{border-radius:0}
.grip{flex:none;cursor:grab;touch-action:none;user-select:none}
.grip i{display:block;width:36px;height:4px;border-radius:9px;background:#d6d6d6;margin:8px auto 4px}
.head{display:flex;align-items:flex-start;gap:12px;padding:4px 20px 14px;border-bottom:1px solid var(--line)}
.head div{flex:1;min-width:0}
.head h2{margin:0;font-size:24px;line-height:34px;font-weight:300;letter-spacing:-.01em}
.head h2::after{content:"";display:block;width:28px;height:2px;background:var(--gold);margin:6px 0 4px;border-radius:2px}
.head p{margin:1px 0 0;color:var(--muted);font-size:14px}
.x{-webkit-appearance:none;appearance:none;padding:0;margin:0;line-height:0;border:0;background:#fff;box-shadow:0 6px 16px rgba(11,40,25,.12);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;cursor:pointer;flex:none}
.x svg{width:16px;height:16px;display:block}
.list{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;margin:0;padding:0 0 calc(90px + env(safe-area-inset-bottom));list-style:none}
.row{display:flex;align-items:center;gap:14px;padding:16px 20px;border-bottom:1px solid var(--line);cursor:pointer}
.row:hover{background:#f7f7f7}
.row.sel{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--gold)}
.row .info{flex:1;min-width:0}
.row h3{margin:0;font-size:16px;font-weight:600;line-height:1.3;letter-spacing:-.005em}
.row .sub{margin-top:6px;color:var(--muted);font-size:14px;display:flex;align-items:center;gap:8px}
.row .sub b{background:var(--accent);color:#fff;font-weight:600;font-size:12.5px;padding:2px 8px;border-radius:5px;box-shadow:0 4px 10px rgba(46,107,70,.3)}
.dir{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#fff;color:var(--accent);box-shadow:0 8px 20px rgba(11,40,25,.12)}
.dir svg{width:20px;height:20px}
.empty{text-align:center;color:var(--muted);padding:28px 20px}
.more{display:block;margin:16px auto;border:1px solid var(--ink);background:#fff;border-radius:8px;padding:10px 18px;font-weight:700;cursor:pointer}

/* map popup */
.leaflet-popup-content-wrapper{border-radius:var(--r-lg);box-shadow:var(--shadow);padding:1px}
.leaflet-popup-content{margin:20px;font-family:var(--font);line-height:1.4}
.pop h3{margin:0 0 4px;padding-right:30px;font-size:20px;font-weight:300;line-height:1.25;letter-spacing:-.01em;color:var(--ink)}
.pop .sub{color:var(--muted);font-size:14px}
.pop .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.pop a{text-decoration:none;border-radius:8px;padding:10px 14px;font-weight:700;font-size:14px;white-space:nowrap}
.pop a.go{background:var(--accent);border:1px solid var(--accent);color:#fff}
.pop a.gm{border:1px solid var(--ink);color:var(--ink)}
.leaflet-container a.leaflet-popup-close-button{top:14px;right:14px;width:28px;height:28px;border-radius:50%;background:#f2f3ef;color:var(--ink);font:400 18px/28px var(--font);text-align:center}
.leaflet-container a.leaflet-popup-close-button:hover{background:#e7e9e3;color:var(--ink)}
.leaflet-container a.leaflet-popup-close-button span{display:block;line-height:27px}
.pop .co{margin-top:12px;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;user-select:all}

/* markers */
.mk{width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--black);border:2.5px solid #fff;box-shadow:-3px 6px 14px rgba(11,40,25,.35);display:grid;place-items:center}
.mk svg{width:15px;height:15px;transform:rotate(45deg)}
.mk.sel{background:var(--black);border-color:var(--gold);border-width:3px;width:36px;height:36px;margin:-6px 0 0 -3px;box-shadow:-3px 8px 18px rgba(46,107,70,.55)}
.you{width:18px;height:18px;border-radius:50%;background:var(--you);border:3px solid #fff;box-shadow:0 0 0 12px rgba(61,139,255,.14),0 4px 10px rgba(61,139,255,.45)}
.cl{width:44px;height:44px;border-radius:50%;background:var(--black);box-shadow:0 0 0 6px rgba(180,159,104,.22),0 10px 22px rgba(11,40,25,.25);display:grid;place-items:center;font-weight:600;font-size:13px;color:#fff;border:2.5px solid #fff}
.chip-km{background:var(--accent);color:#fff;font:600 12.5px var(--font);padding:4px 9px;border-radius:6px;white-space:nowrap;box-shadow:0 6px 14px rgba(46,107,70,.35);transform:translate(-50%,-50%);display:inline-block}

/* suggest a masjid: a request form that goes to the owner for checking, never straight onto the map */
.suggest-row{display:flex;align-items:center;gap:14px;padding:18px 20px;color:var(--accent);font-weight:600;cursor:pointer;border-bottom:1px solid var(--line)}
.suggest-row .plus{width:44px;height:44px;flex:none;border-radius:50%;border:1px dashed var(--gold);display:grid;place-items:center;font-size:22px;font-weight:300;color:var(--accent)}
.suggest-row small{display:block;color:var(--muted);font-weight:400;font-size:13px;margin-top:2px}
.modal{position:fixed;inset:0;z-index:900;background:rgba(11,40,25,.32);display:flex;align-items:flex-end;justify-content:center}
.modal[hidden]{display:none}
.card{background:#fff;width:100%;max-width:440px;max-height:92%;overflow:auto;border-radius:var(--r-xl) var(--r-xl) 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));box-shadow:var(--shadow)}
.card .top-row{display:flex;align-items:flex-start;gap:12px}.card .top-row div{flex:1}
.card h2{margin:0;font-size:24px;line-height:34px;font-weight:300}
.card h2::after{content:"";display:block;width:28px;height:2px;background:var(--gold);margin:6px 0 4px;border-radius:2px}
.card .lead{margin:4px 0 14px;color:var(--muted);font-size:14px}
.field{display:block;margin:0 0 14px}
.field span{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
.field span i{font-style:normal;font-weight:400;color:var(--muted)}
.field input,.field textarea{width:100%;border:1px solid #d9ddd6;border-radius:10px;padding:12px 14px;font-size:16px;background:#fff;outline:none}
.field input:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field textarea{min-height:72px;resize:vertical}
.loc{display:flex;gap:8px;flex-wrap:wrap}
.obtn{-webkit-appearance:none;appearance:none;border:1px solid var(--ink);background:#fff;border-radius:8px;padding:10px 14px;font-weight:700;font-size:14px;cursor:pointer;color:var(--ink)}
.locstate{margin-top:8px;font-size:13px;color:var(--muted)}.locstate.ok{color:var(--accent);font-weight:600}
.err{color:#b3261e;font-size:13px;margin:-4px 0 12px}
.send{-webkit-appearance:none;appearance:none;width:100%;height:52px;border:0;border-radius:999px;background:var(--black);color:#fff;font-size:16px;font-weight:600;cursor:pointer;margin-top:4px}
.fine{color:var(--muted);font-size:12.5px;text-align:center;margin:10px 0 0}
/* pick-on-map mode */
.crosshair,.pickbar,.pickhint{display:none}
body.picking .crosshair{display:block;position:fixed;z-index:650;left:50%;top:50%;width:34px;height:34px;margin:-42px 0 0 -17px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--accent);border:3px solid var(--gold);box-shadow:-3px 8px 16px rgba(11,40,25,.35);pointer-events:none}
body.picking .pickhint{display:block;position:fixed;z-index:700;left:50%;transform:translateX(-50%);top:calc(74px + env(safe-area-inset-top));background:#fff;padding:10px 16px;border-radius:999px;font-size:14px;box-shadow:var(--shadow);white-space:nowrap}
body.picking .pickbar{display:flex;gap:10px;position:fixed;z-index:700;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom))}
body.picking .pickbar button{white-space:nowrap;height:50px;border-radius:999px;padding:0 22px;font-weight:600;font-size:15px;border:0;cursor:pointer;box-shadow:0 12px 28px rgba(11,40,25,.25)}
body.picking .pickbar .ok{background:var(--black);color:#fff}body.picking .pickbar .no{background:#fff;color:var(--ink)}
body.picking .sheet,body.picking #nearBtn,body.picking #mapBtn{visibility:hidden}
@media (min-width:900px){.modal{align-items:center}.card{border-radius:var(--r-xl)}}
.toast{position:fixed;z-index:800;left:50%;top:calc(74px + env(safe-area-inset-top));transform:translateX(-50%);background:rgba(34,34,34,.92);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;max-width:calc(100% - 32px);box-shadow:var(--shadow)}

@media (min-width:900px){
  .top{left:24px;right:auto;width:400px}
  .sheet{left:24px;right:auto;top:86px;bottom:24px;width:400px;height:auto!important;border-radius:var(--r-xl)!important;box-shadow:var(--shadow)}
  body:not(.open) .sheet{transform:translateX(-120%)}
  .grip{cursor:default}.grip i{display:none}.head{padding-top:16px}
  #mapBtn{display:none}
}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
</style>
</head>
<body>
<div id="map" aria-label="Street map"></div>

<div class="top">
  <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" type="search" placeholder="Search masjid or place" autocomplete="off" enterkeyhint="search" aria-label="Search masjid or place"><button class="clear" id="clear" type="button" aria-label="Clear search" hidden><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></label>
</div>

<button class="fab" id="nearBtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l18-8-8 18-2-8-8-2z"/></svg>Near me</button>
<button class="fab" id="mapBtn" type="button" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/></svg>Map</button>

<section class="sheet" id="sheet" aria-label="Masjid list">
  <div class="grip" id="grip">
    <i></i>
    <div class="head"><div><h2 id="title">Nearest masjids</h2><p id="subtitle"></p></div>
      <button class="x" id="closeBtn" type="button" aria-label="Close list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  </div>
  <ul class="list" id="list"></ul>
</section>
<div class="toast" id="toast" hidden></div>
<div class="crosshair" aria-hidden="true"></div>
<div class="pickhint">Move the map so the pin is on the masjid</div>
<div class="pickbar"><button class="no" id="pickCancel" type="button">Cancel</button><button class="ok" id="pickOk" type="button">Use this spot</button></div>

<div class="modal" id="suggest" hidden role="dialog" aria-modal="true" aria-labelledby="sgTitle">
  <form class="card" id="sgForm" novalidate>
    <div class="top-row"><div><h2 id="sgTitle">Suggest a masjid</h2></div>
      <button class="x" id="sgClose" type="button" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <p class="lead">Know a Salafi masjid that's missing? Send it in. It's checked before it appears on the map.</p>
    <label class="field"><span>Masjid name</span><input id="sgName" autocomplete="off" placeholder="e.g. Salafi Juma Masjid, Tirur"></label>
    <label class="field"><span>Area / town</span><input id="sgArea" autocomplete="off" placeholder="e.g. Tirur, Malappuram"></label>
    <div class="field"><span>Location</span>
      <div class="loc"><button class="obtn" id="sgPick" type="button">Pick on map</button><button class="obtn" id="sgHere" type="button">I'm at the masjid now</button></div>
      <div class="locstate" id="sgLoc">No spot chosen yet</div></div>
    <label class="field"><span>Note <i>(optional)</i></span><textarea id="sgNote" placeholder="Organisation, Jumu'ah time, women's area, anything useful"></textarea></label>
    <label class="field"><span>Your name <i>(optional)</i></span><input id="sgFrom" autocomplete="name"></label>
    <p class="err" id="sgErr" hidden></p>
    <button class="send" type="submit" id="sgSend">Send request</button>
    <p class="fine" id="sgFine"></p>
  </form>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const state={q:""};
let masjids=[],you=null,selId=null,listLimit=40,youMarker=null,watchId=null,sheetState="closed";
const isDesk=()=>matchMedia("(min-width:900px)").matches;

/* map: OpenStreetMap tiles, greyed with a CSS filter so the pins stand out */
const map=L.map("map",{zoomControl:false,attributionControl:true}).setView([10.6,76.3],7);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,
  attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(map);
const cluster=L.markerClusterGroup({showCoverageOnHover:false,maxClusterRadius:50,disableClusteringAtZoom:15,
  iconCreateFunction:c=>L.divIcon({className:"",html:`<div class="cl">${c.getChildCount()}</div>`,iconSize:[42,42]})});
map.addLayer(cluster);
const markers=new Map();
const PIN='<svg viewBox="0 0 24 24" fill="#fff"><path d="M12 3c-3 2.6-5.5 4.4-5.5 7.6h11C17.5 7.4 15 5.6 12 3zM6 12h12v8H6z"/></svg>';
const DIR='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.7 11.3l-9-9a1 1 0 00-1.4 0l-9 9a1 1 0 000 1.4l9 9a1 1 0 001.4 0l9-9a1 1 0 000-1.4zM14 14.5V12h-4v3H8v-4a1 1 0 011-1h5V7.5l3.5 3.5z"/></svg>';
const icon=sel=>L.divIcon({className:"",html:`<div class="mk${sel?" sel":""}">${PIN}</div>`,iconSize:[30,30],iconAnchor:[15,36],popupAnchor:[0,-38]});

function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function km(a,b){const R=6371,t=Math.PI/180,dLat=(b.lat-a.lat)*t,dLng=(b.lng-a.lng)*t;const h=Math.sin(dLat/2)**2+Math.cos(a.lat*t)*Math.cos(b.lat*t)*Math.sin(dLng/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function fmtKm(d){return d<1?Math.round(d*1000)+" m":(d<10?d.toFixed(1):Math.round(d))+" km"}
const dirUrl=m=>`https://www.google.com/maps/dir/?api=1&destination=${m.lat},${m.lng}`;
const viewUrl=m=>`https://www.google.com/maps/search/?api=1&query=${m.lat},${m.lng}`;
function toast(t,ms=3500){const n=$("toast");n.textContent=t;n.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>n.hidden=true,ms)}

/* sheet states: closed | mini (header only) | half | full */
const sheet=$("sheet");
const heights=()=>({mini:96,half:Math.round(innerHeight*.5),full:innerHeight-Math.round(document.querySelector(".top").getBoundingClientRect().bottom+8)});
function setSheet(st){
  sheetState=st;
  document.body.classList.toggle("open",st!=="closed");
  document.body.classList.toggle("full",st==="full"&&!isDesk());
  if(st!=="closed"&&!isDesk())sheet.style.setProperty("--h",heights()[st]+"px");
  $("nearBtn").hidden=st!=="closed";
  $("mapBtn").hidden=st!=="full";
}
const bottomPad=()=>isDesk()||sheetState==="closed"?40:(sheetState==="full"?heights().half:heights()[sheetState])+20;
const leftPad=()=>isDesk()&&sheetState!=="closed"?450:40;
(function(){let y0,h0,moved=false,drag=false;
  const g=$("grip");
  g.addEventListener("pointerdown",e=>{if(isDesk()||e.target.closest(".x"))return;drag=true;moved=false;y0=e.clientY;h0=sheet.getBoundingClientRect().height;sheet.classList.add("dragging");g.setPointerCapture(e.pointerId)});
  g.addEventListener("pointermove",e=>{if(!drag)return;if(Math.abs(e.clientY-y0)>6)moved=true;if(moved)sheet.style.setProperty("--h",Math.max(40,Math.min(heights().full,h0+(y0-e.clientY)))+"px")});
  const end=e=>{if(!drag)return;drag=false;sheet.classList.remove("dragging");
    if(!moved){setSheet(sheetState==="half"?"full":"half");return}
    const h=sheet.getBoundingClientRect().height,H=heights();
    if(h<H.mini*.6){setSheet("closed");return}
    const best=["mini","half","full"].reduce((a,b)=>Math.abs(H[b]-h)<Math.abs(H[a]-h)?b:a);
    setSheet(best)};
  g.addEventListener("pointerup",end);g.addEventListener("pointercancel",end);
})();
$("closeBtn").onclick=()=>setSheet("closed");
$("mapBtn").onclick=()=>setSheet("mini");

function filtered(){
  const q=state.q.toLowerCase().trim();
  const r=masjids.filter(m=>!q||(m.name+" "+m.place+" "+m.district).toLowerCase().includes(q));
  if(you){r.forEach(m=>m._d=km(you,m));r.sort((a,b)=>a._d-b._d)}
  else r.sort((a,b)=>a.district.localeCompare(b.district)||a.name.localeCompare(b.name));
  return r;
}
function render(fit,keepMarkers){
  const r=filtered();
  if(!keepMarkers){cluster.clearLayers();cluster.addLayers(r.map(m=>markers.get(m.id)))}
  $("title").textContent=state.q?"Results":(you?"Nearest masjids":"Salafi masjids");
  $("subtitle").textContent=state.q?`${r.length} masjid${r.length===1?"":"s"}${you?" · nearest first":""}`:(you?`${r.length} masjids · nearest first`:`${r.length} across Kerala`);
  const list=$("list");list.replaceChildren();
  if(!r.length)list.innerHTML='<li class="empty">No masjids match that search.</li>';
  const sg=document.createElement("li");sg.className="suggest-row";sg.tabIndex=0;sg.setAttribute("role","button");
  sg.innerHTML=`<span class="plus">+</span><span>${r.length?"Missing a masjid?":"Can't find it?"} Suggest one<small>It's checked before it's added</small></span>`;
  sg.onclick=()=>openSuggest();sg.onkeydown=e=>{if(e.key==="Enter")openSuggest()};
  for(const m of r.slice(0,listLimit)){
    const li=document.createElement("li");li.className="row"+(m.id===selId?" sel":"");li.dataset.id=m.id;li.tabIndex=0;li.setAttribute("role","button");
    const where=esc(m.place||m.district);
    li.innerHTML=`<div class="info"><h3>${esc(m.name)}</h3><div class="sub">${you?`<b>${fmtKm(m._d)}</b>`:""}${where}</div></div>
      <a class="dir" href="${dirUrl(m)}" target="_blank" rel="noopener" aria-label="Directions to ${esc(m.name)}">${DIR}</a>`;
    li.onclick=e=>{if(e.target.closest(".dir"))return;select(m.id)};
    li.onkeydown=e=>{if(e.key==="Enter")select(m.id)};
    list.append(li);
  }
  if(r.length>listLimit){const li=document.createElement("li");li.innerHTML=`<button class="more" type="button">Show more</button>`;li.firstChild.onclick=()=>{listLimit+=60;render(false,true)};list.append(li)}
  list.append(sg);
  if(fit&&r.length)map.fitBounds(L.latLngBounds(r.slice(0,you?8:r.length).map(m=>[m.lat,m.lng]).concat(you?[[you.lat,you.lng]]:[])),{paddingTopLeft:[leftPad(),90],paddingBottomRight:[40,bottomPad()],maxZoom:15});
}

function popupHtml(m){
  return `<div class="pop"><h3>${esc(m.name)}</h3><div class="sub">${esc(m.place||m.district)}${you?" · "+fmtKm(km(you,m))+" away":""}</div>
  <div class="acts"><a class="go" href="${dirUrl(m)}" target="_blank" rel="noopener">Directions</a><a class="gm" href="${viewUrl(m)}" target="_blank" rel="noopener">Open in Google Maps</a></div>
  <div class="co">${m.lat}, ${m.lng}</div></div>`;
}
/* curved dashed route from you to the chosen masjid, with a distance chip, like a flight path */
let route=null,routeChip=null;
function drawRoute(m){
  if(route){map.removeLayer(route);map.removeLayer(routeChip);route=null}
  if(!you)return;
  const a=[you.lat,you.lng],b=[m.lat,m.lng],dx=b[1]-a[1],dy=b[0]-a[0];
  const c=[(a[0]+b[0])/2-dx*.25,(a[1]+b[1])/2+dy*.25],pts=[];
  for(let t=0;t<=1.0001;t+=.05)pts.push([(1-t)**2*a[0]+2*(1-t)*t*c[0]+t*t*b[0],(1-t)**2*a[1]+2*(1-t)*t*c[1]+t*t*b[1]]);
  route=L.polyline(pts,{color:"#b49f68",weight:3,opacity:.85,dashArray:"1 7",lineCap:"round",interactive:false}).addTo(map);
  routeChip=L.marker(pts[10],{interactive:false,icon:L.divIcon({className:"",html:`<span class="chip-km">${fmtKm(km(you,m))}</span>`,iconSize:[0,0]})}).addTo(map);
}
function select(id){
  const m=masjids.find(x=>x.id===id),mk=markers.get(id);if(!m)return;
  const prev=markers.get(selId);if(prev)prev.setIcon(icon(false));
  selId=id;mk.setIcon(icon(true));
  document.querySelectorAll(".row").forEach(e=>e.classList.toggle("sel",e.dataset.id===id));
  if(!isDesk()&&sheetState!=="closed")setSheet("mini"); /* step out of the way, like Google Maps */
  cluster.zoomToShowLayer(mk,()=>{
    const z=Math.max(map.getZoom(),16);
    /* put the pin low enough that its popup fits under the search bar, and clear of the side panel */
    const wantY=isDesk()?innerHeight/2+120:Math.min(340,innerHeight-bottomPad()-40);
    const pt=map.project([m.lat,m.lng],z).add([isDesk()&&sheetState!=="closed"?-212:0,innerHeight/2-wantY]);
    map.flyTo(map.unproject(pt,z),z,{duration:.8});map.once("moveend",()=>mk.openPopup());drawRoute(m)});
}

let qT;
$("q").addEventListener("input",e=>{$("clear").hidden=!e.target.value;clearTimeout(qT);qT=setTimeout(()=>{state.q=e.target.value;listLimit=40;
  if(state.q&&sheetState==="closed")setSheet("half");render(true)},200)});
$("q").addEventListener("keydown",e=>{if(e.key==="Enter"){e.target.blur();if(sheetState==="closed"||sheetState==="mini")setSheet("half")}});
$("clear").onclick=()=>{$("q").value="";$("clear").hidden=true;state.q="";listLimit=40;if(!you)setSheet("closed");render(!!you)};

function setYou(lat,lng,center){
  /* GPS keeps reporting while you move; ignore jitter under 25 m */
  if(!center&&you&&km(you,{lat,lng})<0.025)return;
  you={lat,lng};
  if(!youMarker)youMarker=L.marker([lat,lng],{icon:L.divIcon({className:"",html:'<div class="you"></div>',iconSize:[20,20],iconAnchor:[10,10]}),zIndexOffset:1000,interactive:false}).addTo(map);
  else youMarker.setLatLng([lat,lng]);
  if(center){setSheet("half");$("list").scrollTop=0}
  render(center,!center); /* don't rebuild markers on GPS updates, it would close an open popup */
}
function locate(){
  if(you&&watchId!=null){setSheet("half");render(true,true);return}
  if(!navigator.geolocation){toast("Your browser can't share location. Long-press (or right-click) the map where you are.");return}
  toast("Finding your location…",8000);let first=true;
  watchId=navigator.geolocation.watchPosition(p=>{setYou(p.coords.latitude,p.coords.longitude,first);if(first){$("toast").hidden=true;first=false}},
    err=>{watchId!=null&&navigator.geolocation.clearWatch(watchId);watchId=null;
      toast(err.code===1?"Location is blocked. Allow it in browser settings, or long-press (or right-click) the map where you are.":"Couldn't get your location. Long-press (or right-click) the map where you are.",6000)},
    {enableHighAccuracy:true,maximumAge:30000,timeout:15000});
}
$("nearBtn").onclick=locate;
map.on("contextmenu",e=>{if(watchId!=null){navigator.geolocation.clearWatch(watchId);watchId=null}setYou(e.latlng.lat,e.latlng.lng,true);toast("Showing masjids nearest to this spot")});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&sheetState!=="closed")setSheet("closed")});
addEventListener("resize",()=>{if(sheetState!=="closed")setSheet(sheetState)});

fetch("masjids.json").then(r=>r.json()).then(data=>{
  masjids=data;
  for(const m of masjids){const mk=L.marker([m.lat,m.lng],{icon:icon(false),title:m.name});
    mk.bindPopup(()=>popupHtml(m),{minWidth:285,maxWidth:320,autoPanPaddingTopLeft:[20,80],autoPanPaddingBottomRight:[20,20]});
    mk.on("click",()=>{const prev=markers.get(selId);if(prev&&prev!==mk)prev.setIcon(icon(false));selId=m.id;mk.setIcon(icon(true));drawRoute(m)});
    markers.set(m.id,mk)}
  render();
}).catch(()=>toast("Couldn't load the masjid list. Check your connection and reload.",10000));


/* ---- Suggest a masjid: builds a request the owner checks; nothing is added to the map ---- */
const CONTRIBUTE={channel:"whatsapp",to:"919746837050"}; /* channel: "whatsapp" (to = number with country code, digits only) or "email" */
const sgLoc={lat:null,lng:null};let sheetBefore="closed";
function openSuggest(){$("suggest").hidden=false;$("sgErr").hidden=true;
  $("sgFine").textContent=CONTRIBUTE.channel==="whatsapp"?"Opens WhatsApp with your request ready to send.":CONTRIBUTE.channel==="email"?"Opens your email app with your request ready to send.":"";
  setTimeout(()=>$("sgName").focus(),50)}
function closeSuggest(){$("suggest").hidden=true}
function showLoc(){const ok=sgLoc.lat!=null;$("sgLoc").className="locstate"+(ok?" ok":"");$("sgLoc").textContent=ok?`✓ Spot chosen (${sgLoc.lat.toFixed(5)}, ${sgLoc.lng.toFixed(5)})`:"No spot chosen yet"}
$("sgClose").onclick=closeSuggest;
$("suggest").addEventListener("click",e=>{if(e.target.id==="suggest")closeSuggest()});
$("sgPick").onclick=()=>{closeSuggest();sheetBefore=sheetState;map.closePopup();document.body.classList.add("picking");
  if(sgLoc.lat!=null)map.setView([sgLoc.lat,sgLoc.lng],17);else if(you)map.setView([you.lat,you.lng],16);else if(map.getZoom()<12)map.setZoom(12)};
function endPick(){document.body.classList.remove("picking");openSuggest()}
$("pickOk").onclick=()=>{const c=map.getCenter();
  sgLoc.lat=+c.lat.toFixed(6);sgLoc.lng=+c.lng.toFixed(6);showLoc();endPick()};
$("pickCancel").onclick=endPick;
$("sgHere").onclick=()=>{if(!navigator.geolocation){$("sgLoc").textContent="Your browser can't share location. Use Pick on map.";return}
  $("sgLoc").className="locstate";$("sgLoc").textContent="Getting your location…";
  navigator.geolocation.getCurrentPosition(p=>{sgLoc.lat=+p.coords.latitude.toFixed(6);sgLoc.lng=+p.coords.longitude.toFixed(6);showLoc()},
    ()=>{$("sgLoc").textContent="Couldn't get your location. Use Pick on map instead."},{enableHighAccuracy:true,timeout:15000})};
$("sgForm").addEventListener("submit",e=>{e.preventDefault();
  const name=$("sgName").value.trim(),area=$("sgArea").value.trim(),note=$("sgNote").value.trim(),from=$("sgFrom").value.trim();
  const miss=[!name&&"the masjid name",!area&&"the area",sgLoc.lat==null&&"the location"].filter(Boolean);
  if(miss.length){$("sgErr").textContent="Please add "+miss.join(", ").replace(/, ([^,]*)$/," and $1")+".";$("sgErr").hidden=false;return}
  const text=["Masjid suggestion · Kerala Salafi Masjids","","Name: "+name,"Area: "+area,"Location: https://www.google.com/maps?q="+sgLoc.lat+","+sgLoc.lng,
    note&&"Note: "+note,from&&"From: "+from].filter(x=>x!==false&&x!=="").join("\n");
  let url="";
  if(CONTRIBUTE.channel==="whatsapp"&&CONTRIBUTE.to)url="https://wa.me/"+CONTRIBUTE.to+"?text="+encodeURIComponent(text);
  else if(CONTRIBUTE.channel==="email"&&CONTRIBUTE.to)url="mailto:"+CONTRIBUTE.to+"?subject="+encodeURIComponent("Masjid suggestion: "+name)+"&body="+encodeURIComponent(text);
  if(url){location.href=url;closeSuggest();toast("Thanks! Your request is ready to send.",5000)}
  else{(navigator.clipboard?navigator.clipboard.writeText(text):Promise.reject()).then(()=>toast("Suggestions aren't switched on yet. Your request was copied.",6000),()=>toast("Suggestions aren't switched on yet.",6000))}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(document.body.classList.contains("picking"))endPick();else if(!$("suggest").hidden)closeSuggest()}});

if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
