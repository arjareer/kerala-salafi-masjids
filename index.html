<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kerala Salafi Masjids</title>
<meta name="description" content="Find Salafi (KNM, Markazudawa, Wisdom) masjids across Kerala on a street map, nearest first, with Google Maps directions.">
<meta name="theme-color" content="#0d6b4e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Figtree:wght@400;500;600&family=Noto+Sans+Malayalam:wght@500&display=swap">
<style>
/* Layout: full-screen street map; a panel with search + list sits left on wide screens and below on phones. */
:root{
  --bg:#eef3f1; --surface:#fff; --ink:#13241e; --muted:#5b6e66; --line:#d3ddd9; --hi:#e7f1ea;
  --accent:#0d6b4e; --accent-ink:#fff; --gold:#c9962c; --you:#2563c9; --danger:#b3261e;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,sans-serif;
  --ml:"Noto Sans Malayalam","Figtree",sans-serif;
  --shadow:0 6px 24px rgba(19,36,30,.16);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1714; --surface:#17221e; --ink:#e4eee9; --muted:#93a69e; --line:#2a3a34; --hi:#21352d;
  --accent:#3fb98c; --accent-ink:#06150f; --gold:#e0b04a; --you:#6fa3ff; --danger:#ff8a80;
  --shadow:0 6px 24px rgba(0,0,0,.45); color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 var(--body);overflow:hidden}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
header{background:var(--surface);border-bottom:1px solid var(--line);display:flex;gap:8px 14px;align-items:center;padding:10px max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left))}
.brand{margin-right:auto;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;min-width:0}
h1{font:800 20px var(--display);margin:0;letter-spacing:-.01em}
.ml{font-family:var(--ml);color:var(--muted);font-size:13px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;white-space:nowrap;text-decoration:none;color:var(--ink);font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:5px 11px;font-size:13px}
.main{flex:1;min-height:0;display:grid;grid-template-columns:380px 1fr}
.panel{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
.filters{padding:12px 16px;display:grid;gap:8px;border-bottom:1px solid var(--line)}
.filters input,.filters select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.summary{padding:8px 16px;color:var(--muted);font-size:13px;display:flex;justify-content:space-between;gap:8px}
.list{overflow:auto;flex:1;min-height:0;padding:0 8px calc(16px + env(safe-area-inset-bottom))}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:10px 8px;border-radius:12px;border:1px solid transparent;width:100%;text-align:left;background:none;cursor:pointer}
.item:hover{background:var(--bg)}
.item.sel{border-color:var(--accent);background:var(--hi)}
.dot{width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--gold) inset;margin-top:5px}
.item h3{margin:0;font-size:15px;font-weight:600}
.meta{color:var(--muted);font-size:13px}
.dist{font-variant-numeric:tabular-nums;font-size:13px;color:var(--accent);font-weight:600;white-space:nowrap}
.tag{display:inline-block;font-size:11px;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:999px;background:var(--hi);color:var(--accent);font-weight:600}
.more{margin:8px}
#map{min-height:0;min-width:0;background:var(--bg)}
.mk{width:16px;height:16px;border-radius:50%;background:var(--accent);border:3px solid var(--gold);box-shadow:0 1px 4px rgba(0,0,0,.35)}
.mk.sel{background:var(--gold);border-color:var(--accent);transform:scale(1.4)}
.you{width:16px;height:16px;border-radius:50%;background:var(--you);border:3px solid #fff;box-shadow:0 0 0 8px rgba(37,99,201,.2)}
.marker-cluster-small,.marker-cluster-medium,.marker-cluster-large{background:rgba(201,150,44,.35)}
.marker-cluster-small div,.marker-cluster-medium div,.marker-cluster-large div{background:#0d6b4e;color:#fff;font:600 12px var(--body)}
.leaflet-popup-content{margin:12px 14px;font-family:var(--body)}
.pop h2{font:800 16px var(--display);margin:4px 0}
.pop .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pop .btn.primary{color:#fff}
.notice{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:999px;font-size:13px;z-index:1000;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
@media (max-width:820px){
  .main{grid-template-columns:1fr;grid-template-rows:55% 1fr}
  #map{order:1}.panel{order:2;border-right:0;border-top:1px solid var(--line)}
  .ml,.wide{display:none}
  h1{font-size:17px}
  .btn{padding:6px 11px}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><h1>Kerala Salafi Masjids</h1><span class="ml">കേരളത്തിലെ സലഫി മസ്ജിദുകൾ</span></div>
    <button class="btn primary" id="nearBtn" type="button">◎ Near<span class="wide"> me</span></button>
  </header>
  <div class="main">
    <section class="panel" aria-label="Masjid list">
      <div class="filters">
        <input id="q" type="search" placeholder="Search by masjid name or place" autocomplete="off">
        <div class="row2">
          <select id="fDistrict" aria-label="District"><option value="">All districts</option></select>
          <select id="fOrg" aria-label="Organisation"><option value="">All organisations</option></select>
        </div>
      </div>
      <div class="summary"><span id="count">Loading masjids…</span><span id="sortNote"></span></div>
      <div class="list" id="list"></div>
    </section>
    <div id="map" aria-label="Street map"></div>
  </div>
</div>
<div class="notice" id="notice" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
<script>
const ORG_SHORT={"KNM (Kerala Nadvathul Mujahideen)":"KNM","KNM Markazudawa":"Markazudawa","Wisdom Islamic Organisation":"Wisdom","Salafi (organisation not specified)":"Salafi"};
const $=id=>document.getElementById(id);
const state={q:"",district:"",org:""};
let masjids=[],you=null,selId=null,listLimit=100,youMarker=null,watchId=null;

const map=L.map("map",{zoomControl:true}).setView([10.6,76.3],7);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(map);
const cluster=L.markerClusterGroup({showCoverageOnHover:false,maxClusterRadius:45,disableClusteringAtZoom:15});
map.addLayer(cluster);
const markers=new Map();
const icon=sel=>L.divIcon({className:"",html:`<div class="mk${sel?" sel":""}"></div>`,iconSize:[16,16],iconAnchor:[8,8],popupAnchor:[0,-8]});

function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function km(a,b){const R=6371,t=Math.PI/180,dLat=(b.lat-a.lat)*t,dLng=(b.lng-a.lng)*t;const h=Math.sin(dLat/2)**2+Math.cos(a.lat*t)*Math.cos(b.lat*t)*Math.sin(dLng/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function fmtKm(d){return d<1?Math.round(d*1000)+" m":(d<10?d.toFixed(1):Math.round(d))+" km"}
const dirUrl=m=>`https://www.google.com/maps/dir/?api=1&destination=${m.lat},${m.lng}`;
const viewUrl=m=>`https://www.google.com/maps/search/?api=1&query=${m.lat},${m.lng}`;
function notice(t,ms=4000){const n=$("notice");n.textContent=t;n.hidden=false;clearTimeout(notice.t);notice.t=setTimeout(()=>n.hidden=true,ms)}

function popupHtml(m){
  return `<div class="pop"><span class="tag">${esc(ORG_SHORT[m.org]||"Salafi")}</span><h2>${esc(m.name)}</h2>
  <div class="meta">${esc([m.place,m.district].filter(Boolean).join(" · "))}${you?" · "+fmtKm(km(you,m))+" away":""}</div>
  <div class="acts"><a class="btn primary small" href="${dirUrl(m)}" target="_blank" rel="noopener">Directions</a><a class="btn small" href="${viewUrl(m)}" target="_blank" rel="noopener">Open in Google Maps</a></div></div>`;
}
function filtered(){
  const q=state.q.toLowerCase();
  const r=masjids.filter(m=>(!state.district||m.district===state.district)&&(!state.org||m.org===state.org)&&(!q||(m.name+" "+m.place+" "+m.district).toLowerCase().includes(q)));
  if(you){r.forEach(m=>m._d=km(you,m));r.sort((a,b)=>a._d-b._d)}
  else r.sort((a,b)=>a.district.localeCompare(b.district)||a.name.localeCompare(b.name));
  return r;
}
function render(fit){
  const r=filtered();
  cluster.clearLayers();
  cluster.addLayers(r.map(m=>markers.get(m.id)));
  const ds=new Set(masjids.map(m=>m.district));
  $("count").textContent=r.length===masjids.length?`${masjids.length} masjids in ${ds.size} districts`:`${r.length} of ${masjids.length} masjids`;
  $("sortNote").textContent=you?"Nearest first":"";
  const list=$("list");list.replaceChildren();
  if(!r.length){list.innerHTML='<p class="meta" style="padding:16px">No matches. Try another district, organisation or spelling.</p>'}
  for(const m of r.slice(0,listLimit)){
    const b=document.createElement("button");b.type="button";b.className="item"+(m.id===selId?" sel":"");
    b.innerHTML=`<span class="dot"></span><div><h3>${esc(m.name)}</h3><div class="meta">${esc([m.place,m.district].filter(Boolean).join(" · "))} <span class="tag">${esc(ORG_SHORT[m.org]||"Salafi")}</span></div></div>${you?`<span class="dist">${fmtKm(m._d)}</span>`:""}`;
    b.onclick=()=>select(m.id);list.append(b);
  }
  if(r.length>listLimit){const b=document.createElement("button");b.type="button";b.className="btn small more";b.textContent=`Show ${Math.min(200,r.length-listLimit)} more of ${r.length-listLimit}`;b.onclick=()=>{listLimit+=200;render()};list.append(b)}
  if(fit&&r.length)map.fitBounds(L.latLngBounds(r.map(m=>[m.lat,m.lng])),{padding:[30,30],maxZoom:14});
}
function select(id){
  const prev=markers.get(selId);if(prev)prev.setIcon(icon(false));
  selId=id;const m=masjids.find(x=>x.id===id),mk=markers.get(id);if(!m)return;
  mk.setIcon(icon(true));
  cluster.zoomToShowLayer(mk,()=>{map.setView([m.lat,m.lng],Math.max(map.getZoom(),16));mk.openPopup()});
  document.querySelectorAll(".item.sel").forEach(e=>e.classList.remove("sel"));
}
let qT;$("q").addEventListener("input",e=>{clearTimeout(qT);qT=setTimeout(()=>{state.q=e.target.value;listLimit=100;render(true)},180)});
$("fDistrict").onchange=e=>{state.district=e.target.value;listLimit=100;render(true)};
$("fOrg").onchange=e=>{state.org=e.target.value;listLimit=100;render(true)};

function setYou(lat,lng,center){
  you={lat,lng};
  if(!youMarker)youMarker=L.marker([lat,lng],{icon:L.divIcon({className:"",html:'<div class="you"></div>',iconSize:[16,16],iconAnchor:[8,8]}),zIndexOffset:1000,interactive:false}).addTo(map);
  else youMarker.setLatLng([lat,lng]);
  if(center){const near=filtered().slice(0,5);map.fitBounds(L.latLngBounds([[lat,lng],...near.map(m=>[m.lat,m.lng])]),{padding:[40,40],maxZoom:15})}
  render();
}
$("nearBtn").onclick=()=>{
  if(!navigator.geolocation){notice("This browser can't share your location. Long-press the map where you are instead.");return}
  notice("Finding your location…",8000);
  let first=true;
  if(watchId!=null)navigator.geolocation.clearWatch(watchId);
  watchId=navigator.geolocation.watchPosition(p=>{
    setYou(p.coords.latitude,p.coords.longitude,first);
    if(first){$("notice").hidden=true;$("list").scrollTop=0;first=false}
  },err=>{notice(err.code===1?"Location is blocked. Allow it in your browser settings, or long-press the map where you are.":"Couldn't get your location. Long-press the map where you are instead.",6000)},{enableHighAccuracy:true,maximumAge:30000,timeout:15000});
};
map.on("contextmenu",e=>{if(watchId!=null){navigator.geolocation.clearWatch(watchId);watchId=null}setYou(e.latlng.lat,e.latlng.lng,false);notice("Showing masjids nearest to this spot")});

fetch("masjids.json").then(r=>r.json()).then(data=>{
  masjids=data;
  for(const m of masjids){const mk=L.marker([m.lat,m.lng],{icon:icon(false),title:m.name});mk.bindPopup(()=>popupHtml(m));markers.set(m.id,mk)}
  for(const d of [...new Set(masjids.map(m=>m.district))].sort())$("fDistrict").add(new Option(d,d));
  for(const o of Object.keys(ORG_SHORT))$("fOrg").add(new Option(o,o));
  render();
}).catch(()=>{$("count").textContent="Couldn't load the masjid list. Check your connection and reload."});

if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
